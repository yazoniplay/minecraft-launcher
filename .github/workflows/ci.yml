name: Nour Launcher CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore NourLauncher.sln
      - name: Build
        run: dotnet build NourLauncher.sln --configuration Release --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish src/NourLauncher.App/NourLauncher.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/win-x64
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: nour-launcher-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
